server:
  port: ${PORT:8080}

spring:
  application:
    name: tryon-backend
  servlet:
    multipart:
      max-request-size: 16MB
      max-file-size: 16MB

  # PostgreSQL — Railway PG* o'zgaruvchilaridan (lokalda localhost default).
  # Railway: backend servisiga Postgres'ning PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD
  # o'zgaruvchilarini reference qiling (yoki SPRING_DATASOURCE_URL ni bering).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:sima}}
    username: ${PGUSER:sima}
    password: ${PGPASSWORD:sima}
  jpa:
    hibernate:
      ddl-auto: none   # sxemani to'liq Flyway boshqaradi (Hibernate o'zgartirmaydi/tekshirmaydi)
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

# Try-on sozlamalari — barchasi env o'zgaruvchilardan (lokalda default qiymatlar).
# Production'da bularni platforma (Railway/Render) env sozlamalarida beriladi.
tryon:
  # Modal web endpoint (deploy qilingan)
  modal-url: ${TRYON_MODAL_URL:https://elusm17--catvton-tryon-tryon-tryon-api.modal.run}

  # Modal ichki secret (hozir Modal tarafida tekshiruv yo'q — keyin qo'shiladi)
  modal-secret: ${TRYON_MODAL_SECRET:}

  # Sotuvchi API kalitlari (vergul bilan). Demo uchun bitta test kalit.
  # Production'da DB'dan yoki ko'proq kalit.
  api-keys: ${TRYON_API_KEYS:test-key-12345}

  # Ruxsat etilgan domenlar (vergul bilan). Bo'sh = hammasiga ruxsat (demo).
  allowed-origins: ${TRYON_ALLOWED_ORIGINS:}

  # Bir kalit uchun daqiqasiga maksimal so'rov
  rate-limit-per-minute: ${TRYON_RATE_LIMIT:5}

  # Maksimal rasm hajmi (bayt) — 8 MB
  max-image-bytes: ${TRYON_MAX_IMAGE_BYTES:8388608}

  # Sessiya tokeni (HMAC imzo) — Production'da TRYON_TOKEN_SECRET ni albatta o'rnating
  token-secret: ${TRYON_TOKEN_SECRET:dev-secret-change-me}
  token-ttl-seconds: ${TRYON_TOKEN_TTL_SECONDS:300}

  # OTP (telefon tasdiqlash).
  # ⚠️ PRE-RELEASE: kod hozircha doim "123456" (env'siz kirish uchun).
  # Real ishga tushirishdan oldin: TRYON_OTP_FIXED_CODE="" qiling + Telegram/SMS ulang.
  otp-ttl-seconds: ${TRYON_OTP_TTL_SECONDS:300}
  otp-fixed-code: ${TRYON_OTP_FIXED_CODE:123456}
  # Dev: kodni send-otp javobida qaytarish (frontend toast). Production'da false!
  otp-expose-code: ${TRYON_OTP_EXPOSE_CODE:false}

  # ML detektorlar — default O'CHIQ (xotira tejash). Try-on ustida ishlaganda yoqing:
  #   TRYON_YOLO_ENABLED=true va TRYON_POSE_ENABLED=true
  yolo-enabled: ${TRYON_YOLO_ENABLED:false}
  pose-enabled: ${TRYON_POSE_ENABLED:false}

  # Rasm sifati tekshiruvi (POST /api/check) chegaralari
  check:
    min-width: ${TRYON_CHECK_MIN_WIDTH:256}
    min-height: ${TRYON_CHECK_MIN_HEIGHT:256}
    blur-min: ${TRYON_CHECK_BLUR_MIN:10.0}
    brightness-min: ${TRYON_CHECK_BRIGHTNESS_MIN:30}
    brightness-max: ${TRYON_CHECK_BRIGHTNESS_MAX:235}
    person-score-min: ${TRYON_CHECK_PERSON_SCORE_MIN:0.25}
    keypoint-score-min: ${TRYON_CHECK_KEYPOINT_SCORE_MIN:0.30}

logging:
  level:
    uz.tryon.api: INFO
