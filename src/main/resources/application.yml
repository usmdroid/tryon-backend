server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: ${TRYON_TOMCAT_THREADS:25}
      min-spare: ${TRYON_TOMCAT_MIN_SPARE:5}
    max-connections: ${TRYON_TOMCAT_MAX_CONN:200}
    accept-count: 20

spring:
  application:
    name: tryon-backend
  servlet:
    multipart:
      max-request-size: 16MB
      max-file-size: 16MB
  # Redis autoconfiguratsiyasini o'chiramiz — RedisConfig.java shartli ulanadi.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  # PostgreSQL — Railway PG* o'zgaruvchilaridan (lokalda localhost default).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:sima}}
    username: ${PGUSER:sima}
    password: ${PGPASSWORD:sima}
    hikari:
      maximum-pool-size: ${TRYON_DB_POOL_MAX:5}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: none   # sxemani to'liq Flyway boshqaradi
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

# SENTRY_DSN — bo'sh bo'lsa Sentry to'liq o'chiq (dev default).
sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.1
  environment: ${SENTRY_ENV:production}
  release: '@project.version@'

tryon:
  # TRYON_MAINTENANCE — true bo'lsa /session, /check, /tryon 503 qaytaradi.
  maintenance: ${TRYON_MAINTENANCE:false}

  # TRYON_MODAL_URL — Modal web endpoint.
  modal-url: ${TRYON_MODAL_URL:https://elusm17--catvton-tryon-tryon-tryon-api.modal.run}

  # TRYON_MODAL_SECRET — Modal HMAC secret; prodda majburiy, bo'sh bo'lsa ilovа ishlamaydi.
  modal-secret: ${TRYON_MODAL_SECRET:}

  # TRYON_API_KEYS — vergul bilan ajratilgan API kalitlar (legacy config kalitlar).
  api-keys: ${TRYON_API_KEYS:test-key-12345}

  # TRYON_ALLOWED_ORIGINS — ruxsat etilgan domenlar; bo'sh = hammasiga ruxsat.
  allowed-origins: ${TRYON_ALLOWED_ORIGINS:}

  # TRYON_RATE_LIMIT — bir kalit uchun daqiqasiga maksimal so'rov soni.
  rate-limit-per-minute: ${TRYON_RATE_LIMIT:5}

  # TRYON_MAX_IMAGE_BYTES — maksimal rasm hajmi baytda.
  max-image-bytes: ${TRYON_MAX_IMAGE_BYTES:8388608}

  # TRYON_SUPER_ADMIN_PHONE — ishga tushganda shu telefonli mijozga SUPER_ADMIN roli beriladi.
  super-admin-phone: ${TRYON_SUPER_ADMIN_PHONE:${SUPER_ADMIN_PHONE:}}

  # TRYON_DEMO_SEED — true bo'lsa monitoring sahifasi uchun demo ma'lumotlar qo'shiladi.
  demo-seed: ${TRYON_DEMO_SEED:false}

  # TRYON_TOKEN_SECRET — sessiya tokeni HMAC imzo siri; prodda albatta o'rnating.
  token-secret: ${TRYON_TOKEN_SECRET:dev-secret-change-me}
  token-ttl-seconds: ${TRYON_TOKEN_TTL_SECONDS:300}
  # TRYON_KEY_ENC_SECRET — API kalitlarni shifrlash siri (AES); prodda albatta o'rnating.
  key-enc-secret: ${TRYON_KEY_ENC_SECRET:dev-secret-change-me}

  # TRYON_OTP_TTL_SECONDS — OTP kodi amal qilish muddati soniyada.
  otp-ttl-seconds: ${TRYON_OTP_TTL_SECONDS:300}
  # TRYON_OTP_FIXED_CODE — bo'sh = tasodifiy kod; lokal dev'da qattiq kod uchun bering.
  otp-fixed-code: ${TRYON_OTP_FIXED_CODE:}
  # TRYON_OTP_EXPOSE_CODE — true bo'lsa kodni send-otp javobida qaytaradi (faqat dev!).
  otp-expose-code: ${TRYON_OTP_EXPOSE_CODE:false}

  # MAIL_PROVIDER — email provayder (resend).
  mail-provider: ${MAIL_PROVIDER:resend}
  # MAIL_FROM — yuboruvchi email manzil.
  mail-from: ${MAIL_FROM:noreply@trysima.uz}
  # RESEND_API_KEY — Resend API kaliti; prodda Railway env orqali bering.
  resend-api-key: ${RESEND_API_KEY:your_apikey}

  # REDIS_URL — rate limit uchun Redis; bo'sh = xotirada ishlaydi.
  redis-url: ${REDIS_URL:}

  # R2_ENDPOINT/R2_BUCKET/R2_ACCESS_KEY/R2_SECRET_KEY — natija rasmlari uchun R2 saqlash.
  r2-endpoint: ${R2_ENDPOINT:}
  r2-bucket: ${R2_BUCKET:}
  r2-access-key: ${R2_ACCESS_KEY:}
  r2-secret-key: ${R2_SECRET_KEY:}

  # TRYON_YOLO_ENABLED / TRYON_POSE_ENABLED — ML detektorlar; default o'chiq.
  yolo-enabled: ${TRYON_YOLO_ENABLED:false}
  pose-enabled: ${TRYON_POSE_ENABLED:false}

  # Rasm sifati tekshiruvi (POST /api/check) chegaralari.
  check:
    min-width: ${TRYON_CHECK_MIN_WIDTH:256}
    min-height: ${TRYON_CHECK_MIN_HEIGHT:256}
    blur-min: ${TRYON_CHECK_BLUR_MIN:10.0}
    brightness-min: ${TRYON_CHECK_BRIGHTNESS_MIN:30}
    brightness-max: ${TRYON_CHECK_BRIGHTNESS_MAX:235}
    person-score-min: ${TRYON_CHECK_PERSON_SCORE_MIN:0.25}
    keypoint-score-min: ${TRYON_CHECK_KEYPOINT_SCORE_MIN:0.30}
    face-ear-ratio-min: ${TRYON_CHECK_FACE_EAR_RATIO_MIN:0.5}
    eye-strong-threshold: ${TRYON_CHECK_EYE_STRONG:0.4}
    nose-strong-threshold: ${TRYON_CHECK_NOSE_STRONG:0.3}
    shoulder-asymmetry-max: ${TRYON_CHECK_SH_ASYM:0.3}

logging:
  level:
    uz.tryon.api: INFO
