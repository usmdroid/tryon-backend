server:
  port: ${PORT:8080}
  # Tomcat thread/connection cheklash — xotira tejash (kam yuk uchun).
  tomcat:
    threads:
      max: ${TRYON_TOMCAT_THREADS:25}      # default 200; 25 bemalol yetadi
      min-spare: ${TRYON_TOMCAT_MIN_SPARE:5}
    max-connections: ${TRYON_TOMCAT_MAX_CONN:200}
    accept-count: 20

spring:
  application:
    name: tryon-backend
  servlet:
    multipart:
      max-request-size: 16MB
      max-file-size: 16MB
  # Redis autoconfiguratsiyasini o'chiramiz — RedisConfig.java shartli ulanadi.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  # PostgreSQL — Railway PG* o'zgaruvchilaridan (lokalda localhost default).
  # Railway: backend servisiga Postgres'ning PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD
  # o'zgaruvchilarini reference qiling (yoki SPRING_DATASOURCE_URL ni bering).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:sima}}
    username: ${PGUSER:sima}
    password: ${PGPASSWORD:sima}
    # DB pool kichik — bitta-ikkita ulanish yetadi (kam foydalanuvchi, xotira tejash).
    hikari:
      maximum-pool-size: ${TRYON_DB_POOL_MAX:5}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: none   # sxemani to'liq Flyway boshqaradi (Hibernate o'zgartirmaydi/tekshirmaydi)
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

# Try-on sozlamalari — barchasi env o'zgaruvchilardan (lokalda default qiymatlar).
# Production'da bularni platforma (Railway/Render) env sozlamalarida beriladi.
tryon:
  # Texnik tanaffus rejimi (xotira tejash) — true bo'lsa /session, /check, /tryon
  # 503 qaytaradi, kirish rasm so'rovi umuman decode qilinmaydi.
  # Auth, kabinet, monitoring, admin BARIBIR ishlaydi.
  # Yoqish: Railway env TRYON_MAINTENANCE=true.
  maintenance: ${TRYON_MAINTENANCE:false}

  # Modal web endpoint (deploy qilingan)
  modal-url: ${TRYON_MODAL_URL:https://elusm17--catvton-tryon-tryon-tryon-api.modal.run}

  # Modal ichki secret (hozir Modal tarafida tekshiruv yo'q — keyin qo'shiladi)
  modal-secret: ${TRYON_MODAL_SECRET:}

  # Sotuvchi API kalitlari (vergul bilan). Demo uchun bitta test kalit.
  # Production'da DB'dan yoki ko'proq kalit.
  api-keys: ${TRYON_API_KEYS:test-key-12345}

  # Ruxsat etilgan domenlar (vergul bilan). Bo'sh = hammasiga ruxsat (demo).
  allowed-origins: ${TRYON_ALLOWED_ORIGINS:}

  # Bir kalit uchun daqiqasiga maksimal so'rov
  rate-limit-per-minute: ${TRYON_RATE_LIMIT:5}

  # Maksimal rasm hajmi (bayt) — 8 MB
  max-image-bytes: ${TRYON_MAX_IMAGE_BYTES:8388608}

  # Super-admin telefoni — ishga tushganda shu telefonli mijozga SUPER_ADMIN roli beriladi.
  # Bo'sh = hech kim super-admin qilinmaydi. Kodda telefon yozilmaydi (faqat env).
  super-admin-phone: ${TRYON_SUPER_ADMIN_PHONE:${SUPER_ADMIN_PHONE:}}

  # Demo seed: monitoring sahifalarini vizual tekshirish uchun demo ma'lumotlari.
  # Faqat dev/staging uchun. Yoqish: TRYON_DEMO_SEED=true env.
  demo-seed: ${TRYON_DEMO_SEED:false}

  # Sessiya tokeni (HMAC imzo) — Production'da TRYON_TOKEN_SECRET ni albatta o'rnating
  token-secret: ${TRYON_TOKEN_SECRET:dev-secret-change-me}
  token-ttl-seconds: ${TRYON_TOKEN_TTL_SECONDS:300}
  # API kalitlarni teskari shifrlash siri (AES) — Production'da albatta o'rnating
  key-enc-secret: ${TRYON_KEY_ENC_SECRET:dev-secret-change-me}

  # OTP (email tasdiqlash).
  # Real rejim: fixed-code BO'SH = har safar tasodifiy 6 xonali kod (Resend orqali yuboriladi).
  # Lokal dev'da qat'iy kod kerak bo'lsa: TRYON_OTP_FIXED_CODE=123456 env bilan bering.
  otp-ttl-seconds: ${TRYON_OTP_TTL_SECONDS:300}
  otp-fixed-code: ${TRYON_OTP_FIXED_CODE:}
  # Dev: kodni send-otp javobida qaytarish (frontend toast). Production'da false!
  otp-expose-code: ${TRYON_OTP_EXPOSE_CODE:false}

  # Email (OTP yetkazish). trysima.uz Resend'da verified — real email yuboriladi.
  # ⚠️ resend-api-key — MAXFIY. Pastdagi "your_apikey" ni haqiqiy kalit (re_...) bilan almashtiring.
  #    Eslatma: bu fayl git'ga tushadi — kalitni shu yerga yozsangiz push qilmang
  #    (yoki yaxshisi Railway env RESEND_API_KEY bilan bering — u shu default'ni bekor qiladi).
  mail-provider: ${MAIL_PROVIDER:resend}
  mail-from: ${MAIL_FROM:noreply@trysima.uz}
  resend-api-key: ${RESEND_API_KEY:your_apikey}

  # Redis (rate limit uchun). Bo'sh = xotirada ishlaydi (lokal/test uchun).
  redis-url: ${REDIS_URL:}

  # R2 saqlash (faqat natija rasmi, kirish rasmlari saqlanmaydi — maxfiylik).
  # Bo'sh = saqlash o'chiq (lokal/test uchun).
  r2-endpoint: ${R2_ENDPOINT:}
  r2-bucket: ${R2_BUCKET:}
  r2-access-key: ${R2_ACCESS_KEY:}
  r2-secret-key: ${R2_SECRET_KEY:}

  # ML detektorlar — default O'CHIQ (xotira tejash). Try-on ustida ishlaganda yoqing:
  #   TRYON_YOLO_ENABLED=true va TRYON_POSE_ENABLED=true
  yolo-enabled: ${TRYON_YOLO_ENABLED:false}
  pose-enabled: ${TRYON_POSE_ENABLED:false}

  # Rasm sifati tekshiruvi (POST /api/check) chegaralari
  check:
    min-width: ${TRYON_CHECK_MIN_WIDTH:256}
    min-height: ${TRYON_CHECK_MIN_HEIGHT:256}
    blur-min: ${TRYON_CHECK_BLUR_MIN:10.0}
    brightness-min: ${TRYON_CHECK_BRIGHTNESS_MIN:30}
    brightness-max: ${TRYON_CHECK_BRIGHTNESS_MAX:235}
    person-score-min: ${TRYON_CHECK_PERSON_SCORE_MIN:0.25}
    keypoint-score-min: ${TRYON_CHECK_KEYPOINT_SCORE_MIN:0.30}

logging:
  level:
    uz.tryon.api: INFO
