# Test profili — H2 (xotirada), Postgres'siz. Sxema entity'lardan quriladi (Flyway o'chiq).
spring:
  datasource:
    url: jdbc:h2:mem:simatest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

# Test/dev: OTP kodi doim shu (log rejimida kodni log'dan o'qishsiz test qilish uchun)
tryon:
  otp-fixed-code: "123456"
  # Testlarda ML detektorlar yoniq (CheckEndpointTest ularni sinaydi)
  yolo-enabled: true
  pose-enabled: true
