name: Build & Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B -q test

      - name: Package (skip tests, already ran)
        run: mvn -B -q -DskipTests package

      - name: Locate JAR
        id: jar
        run: |
          JAR=$(ls -1 target/*.jar | grep -v "original" | head -n1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "JAR: $JAR ($(du -h "$JAR" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ${{ steps.jar.outputs.path }}
          retention-days: 7

  deploy:
    name: Deploy to Kamatera
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./artifact

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload JAR to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          JAR=$(ls -1 artifact/*.jar | head -n1)
          echo "Uploading $JAR → $SERVER_USER@$SERVER_HOST:/opt/sima/app.jar"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "$JAR" "$SERVER_USER@$SERVER_HOST:/opt/sima/app.jar"

      - name: Restart service
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "$SERVER_USER@$SERVER_HOST" "systemctl restart sima-backend"

      - name: Wait for startup (30s)
        run: sleep 30

      - name: Health check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -e
          HEALTH=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
                       "$SERVER_USER@$SERVER_HOST" \
                       "curl -fsS http://localhost:8080/api/health" 2>/dev/null || echo "FAIL")
          if [ "$HEALTH" = "FAIL" ]; then
            echo "::error::Health check failed — recent logs below"
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
                "$SERVER_USER@$SERVER_HOST" \
                "journalctl -u sima-backend --no-pager -n 40"
            exit 1
          fi
          echo "✓ $HEALTH"

      - name: Tail last 10 log lines
        if: success()
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "$SERVER_USER@$SERVER_HOST" \
              "journalctl -u sima-backend --no-pager -n 10 | grep -v '^--' || true"
